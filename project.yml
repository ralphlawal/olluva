# The Xcode project is generated from this file: run `xcodegen generate`.
# CoupleNotes.xcodeproj is not committed.
name: CoupleNotes
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  developmentLanguage: en
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  CoupleKit:
    path: Packages/CoupleKit
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  CoupleNotes:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CoupleKit
        product: CoupleDomain
      - package: CoupleKit
        product: CoupleDesign
      - package: CoupleKit
        product: CoupleWidgetUI
      - package: CoupleKit
        product: CoupleLocalBackend
      - package: CoupleKit
        product: CoupleSupabase
      - target: CoupleNotesWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: CoupleNotes
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/CoupleNotes.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [couplenotes]
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        AppGroupID: $(APP_GROUP_ID)
        PushEnvironment: $(APS_ENVIRONMENT)
    entitlements:
      path: App/CoupleNotes.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
  CoupleNotesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
    dependencies:
      - package: CoupleKit
        product: CoupleDomain
      - package: CoupleKit
        product: CoupleDesign
      - package: CoupleKit
        product: CoupleWidgetUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/CoupleNotesWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/CoupleNotesWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
  CoupleNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
      # StoreKit tests buy against the same catalogue the app is run with.
      - path: App/Resources/Products.storekit
        buildPhase: resources
    dependencies:
      - target: CoupleNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CoupleNotes.app/CoupleNotes
        BUNDLE_LOADER: $(TEST_HOST)
  CoupleNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: CoupleNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CoupleNotes
schemes:
  CoupleNotes:
    build:
      targets:
        CoupleNotes: all
        CoupleNotesWidgets: all
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Products.storekit
    test:
      config: Debug
      targets:
        - CoupleNotesTests
        - CoupleNotesUITests
    archive:
      config: Release
